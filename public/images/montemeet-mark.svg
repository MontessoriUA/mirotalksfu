<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Montessori Meet">
  <!--
    Знак Montessori Meet, неподвижный: закруглённая «м» из двух арок.
    Пути и градиенты — из айдентики мобильной версии
    (montemeet-app/docs/Айдентика/прелоадер-u1.html и meet/src/ui/Logo.tsx).

    Для прелоадеров есть анимированный близнец — montemeet-arch.svg.

    Теней из айдентики здесь нет намеренно: SVG-фильтр растрируется, и на
    размерах интерфейса (знак в шапке — 42 точки) мягкая тень превращается в
    мыло (Иван, 24.11). В крупной иконке магазина тени остаются.

    До 24.11 в вебе и в кабинете стоял прежний знак (две фигурки, logo-m.png);
    актуальный лежал только картинкой превью ссылок.
  -->
  <defs>
    <linearGradient id="markLeft" x1="0.1" y1="0" x2="0.85" y2="0.75">
      <stop offset="0" stop-color="#88B92C" />
      <stop offset="0.45" stop-color="#12A578" />
      <stop offset="1" stop-color="#008C99" />
    </linearGradient>
    <linearGradient id="markRight" x1="0" y1="0.1" x2="0.9" y2="0.7">
      <stop offset="0" stop-color="#F7B234" />
      <stop offset="0.55" stop-color="#EE7A33" />
      <stop offset="1" stop-color="#E5422E" />
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="14" stroke-linecap="round">
    <path d="M20 70.5 V44.5 A15 15 0 0 1 50 44.5 V70.5" stroke="url(#markLeft)" />
    <path d="M50 70.5 V44.5 A15 15 0 0 1 80 44.5 V70.5" stroke="url(#markRight)" />
  </g>
</svg>
