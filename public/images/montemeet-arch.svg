<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Montessori Meet">
  <!--
    Знак Montessori Meet: две арки. Взят как есть из айдентики мобильной
    версии — montemeet-app/docs/Айдентика/прелоадер-u1.html (Иван, 30.09:
    «это и лого приложения, а анимированное — ещё и прелоадер для экранов»).
    Дуги подняты на 9,5, чтобы при штрихе 14 знак стоял ровно по центру поля
    100×100: по высоте 22,5…77,5, по ширине 13…87.

    В вебе до 24.11 в прелоадере висел стоковый logo.svg MiroTalk.
  -->
  <defs>
    <linearGradient id="archLeft" x1="0.1" y1="0" x2="0.85" y2="0.75">
      <stop offset="0" stop-color="#88B92C" />
      <stop offset="0.45" stop-color="#12A578" />
      <stop offset="1" stop-color="#008C99" />
    </linearGradient>
    <linearGradient id="archRight" x1="0" y1="0.1" x2="0.9" y2="0.7">
      <stop offset="0" stop-color="#F7B234" />
      <stop offset="0.55" stop-color="#EE7A33" />
      <stop offset="1" stop-color="#E5422E" />
    </linearGradient>
    <style>
      @keyframes mmUnroll {
        0% { stroke-dashoffset: 100 }
        38% { stroke-dashoffset: 0 }
        62% { stroke-dashoffset: 0 }
        100% { stroke-dashoffset: 100 }
      }
      .arch {
        fill: none;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-dasharray: 100;
        animation: mmUnroll 1.8s cubic-bezier(.5, 0, .3, 1) infinite;
      }
      .arch-right { animation-delay: .22s }
      @media (prefers-reduced-motion: reduce) {
        .arch { animation: none; stroke-dashoffset: 0 }
      }
    </style>
  </defs>
  <path class="arch arch-left" d="M20 70.5 V44.5 A15 15 0 0 1 50 44.5 V70.5" stroke="url(#archLeft)" />
  <path class="arch arch-right" d="M50 70.5 V44.5 A15 15 0 0 1 80 44.5 V70.5" stroke="url(#archRight)" />
</svg>
